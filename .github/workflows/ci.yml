name: CI Pipeline - Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositório
      uses: actions/checkout@v4

    - name: Configurar o Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir imagem Docker (Teste de CI)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: meu-site-docker:latest
