name: CI/CD Pipeline - Docker & AWS EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositório
      uses: actions/checkout@v4

    - name: Configurar o Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir imagem Docker (Teste de CI)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: meu-site-docker:latest

    - name: Executar Deploy na AWS EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd site-docker
          git pull origin main
          sudo docker rm -f container-novo || true
          sudo docker build -t meu-site-docker .
          sudo docker run -d -p 8080:8080 --name container-novo meu-site-docker
